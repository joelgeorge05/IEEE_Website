<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050D1A"/>
      <stop offset="50%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#030810"/>
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#00629B"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <pattern id="posterGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 210, 255, 0.08)" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="1100" fill="url(#bgGradient)"/>
  <rect width="800" height="1100" fill="url(#posterGrid)"/>

  <!-- Cyber Accents -->
  <circle cx="700" cy="200" r="250" fill="#00629B" opacity="0.25" filter="url(#glow)"/>
  <circle cx="100" cy="850" r="280" fill="#00D2FF" opacity="0.15" filter="url(#glow)"/>

  <!-- Outer Tech Border -->
  <rect x="25" y="25" width="750" height="1050" rx="20" fill="none" stroke="#1E2D4A" stroke-width="2"/>
  <rect x="40" y="40" width="720" height="1020" rx="16" fill="none" stroke="rgba(0, 210, 255, 0.3)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Corner Tech Brackets -->
  <path d="M 25 70 L 25 25 L 70 25" fill="none" stroke="#00D2FF" stroke-width="4"/>
  <path d="M 775 70 L 775 25 L 730 25" fill="none" stroke="#00D2FF" stroke-width="4"/>
  <path d="M 25 1030 L 25 1075 L 70 1075" fill="none" stroke="#00D2FF" stroke-width="4"/>
  <path d="M 775 1030 L 775 1075 L 730 1075" fill="none" stroke="#00D2FF" stroke-width="4"/>

  <!-- Header Branding -->
  <g transform="translate(60, 75)">
    <!-- IEEE & MBITS Header -->
    <rect x="0" y="0" width="110" height="42" rx="8" fill="#FFFFFF"/>
    <text x="55" y="28" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="20" fill="#00629B" text-anchor="middle">IEEE</text>

    <text x="130" y="28" font-family="'JetBrains Mono', monospace" font-size="16" fill="#64748B">|</text>

    <rect x="150" y="0" width="120" height="42" rx="8" fill="#FFFFFF"/>
    <text x="210" y="28" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="18" fill="#050D1A" text-anchor="middle">MBITS</text>

    <!-- Branch Tag -->
    <rect x="520" y="6" width="160" height="30" rx="15" fill="rgba(0, 210, 255, 0.15)" stroke="rgba(0, 210, 255, 0.4)"/>
    <text x="600" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#00D2FF" text-anchor="middle">SB CODE 65041</text>
  </g>

  <!-- Chapter Title Text -->
  <text x="400" y="180" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#00D2FF" letter-spacing="4" text-anchor="middle">
    IEEE COMPUTER SOCIETY MBITS CHAPTER
  </text>
  <text x="400" y="210" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#94A3B8" letter-spacing="3" text-anchor="middle">
    MAR BASELIOS INSTITUTE OF TECH &amp; SCIENCE
  </text>

  <text x="400" y="260" font-family="'JetBrains Mono', monospace" font-size="13" fill="#F59E0B" letter-spacing="6" text-anchor="middle">
    — PRESENTS THE OFFICIAL SHOWDOWN —
  </text>

  <!-- Big Event Title: WEBNOVA 2026 -->
  <text x="400" y="380" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="82" fill="url(#cyanBlue)" text-anchor="middle" filter="url(#glow)">
    WEBNOVA
  </text>
  <text x="400" y="440" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">
    WEBSITE DESIGN COMPETITION 2026
  </text>

  <!-- Tagline Quote Box -->
  <rect x="100" y="475" width="600" height="60" rx="12" fill="rgba(14, 23, 38, 0.8)" stroke="#1E2D4A"/>
  <text x="400" y="512" font-family="'Plus Jakarta Sans', sans-serif" font-style="italic" font-size="15" fill="#E2E8F0" text-anchor="middle">
    "The web is your canvas. Your creativity is the limit."
  </text>

  <!-- Prize Pool Banner -->
  <g transform="translate(150, 565)">
    <rect x="0" y="0" width="500" height="120" rx="20" fill="rgba(0, 98, 155, 0.25)" stroke="#00D2FF" stroke-width="2"/>
    <text x="250" y="40" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#00D2FF" letter-spacing="3" text-anchor="middle">
      TOTAL PRIZE POOL
    </text>
    <text x="250" y="95" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="52" fill="url(#goldGrad)" text-anchor="middle">
      ₹1,000 CASH
    </text>
  </g>

  <!-- Details Matrix (3 Columns) -->
  <g transform="translate(80, 715)">
    <!-- Col 1 -->
    <rect x="0" y="0" width="195" height="120" rx="14" fill="#0E1726" stroke="#1E2D4A"/>
    <text x="97" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">ENTRY FEE</text>
    <text x="97" y="70" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="20" fill="#10B981" text-anchor="middle">IEEE: FREE</text>
    <text x="97" y="98" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0" text-anchor="middle">Non-IEEE: ₹15</text>

    <!-- Col 2 -->
    <rect x="220" y="0" width="195" height="120" rx="14" fill="#0E1726" stroke="#1E2D4A"/>
    <text x="317" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">SUBMISSION DEADLINE</text>
    <text x="317" y="72" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="22" fill="#00D2FF" text-anchor="middle">30 SEPT</text>
    <text x="317" y="98" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0" text-anchor="middle">2026 // 23:59 IST</text>

    <!-- Col 3 -->
    <rect x="440" y="0" width="195" height="120" rx="14" fill="#0E1726" stroke="#1E2D4A"/>
    <text x="537" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">CONTEST MODE</text>
    <text x="537" y="70" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="20" fill="#F59E0B" text-anchor="middle">ONLINE</text>
    <text x="537" y="98" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0" text-anchor="middle">Individual Entry</text>
  </g>

  <!-- Guidelines & Deliverables -->
  <g transform="translate(80, 860)">
    <rect x="0" y="0" width="640" height="110" rx="14" fill="rgba(14, 23, 38, 0.7)" stroke="#1E2D4A"/>
    <text x="30" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#00D2FF">
      SUBMISSION GUIDELINES:
    </text>
    <text x="30" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#CBD5E1">
      • Design and develop a responsive website for IEEE CS MBITS student chapter.
    </text>
    <text x="30" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#CBD5E1">
      • Submit ZIP archive with source code + Live URL / GitHub link + Screenshots.
    </text>
  </g>

  <!-- Footer Info -->
  <g transform="translate(60, 1000)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#1E2D4A" stroke-width="1.5"/>
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">
      ORG: IEEE COMPUTER SOCIETY MBITS // KERALA SECTION
    </text>
    <text x="680" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00D2FF" text-anchor="end">
      SCAN OR REGISTER AT LOCALHOST:5173
    </text>
  </g>
</svg>
